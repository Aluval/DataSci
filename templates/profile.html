{% extends 'base.html' %}
{% block content %}
<h3>Profile</h3>
<div class="card p-3">
  <form method="post">
    <div class="mb-3"><label>Full name</label><input class="form-control" name="fullName" value="{{ user.fullName }}"></div>
    <div class="mb-3"><label>Email</label><input class="form-control" name="email" value="{{ user.email }}" readonly></div>
    <div class="mb-3"><label>Mobile</label><input class="form-control" name="mobile" value="{{ user.mobile }}"></div>
    <button class="btn btn-primary">Save</button>
  </form>
</div>
{% endblock %}
