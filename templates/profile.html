{% extends "base.html" %}

{% block content %}

<div class="container mt-4 mb-5">

    <h2 class="fw-bold text-primary text-center mb-4">User Profile</h2>

    <div class="card shadow p-4 mx-auto" style="max-width: 600px; border-radius: 12px;">

        <h5 class="fw-semibold text-primary mb-3">Your Account Details</h5>

        <form method="POST" class="row g-3">

            <!-- Full Name -->
            <div class="col-12">
                <label class="form-label fw-semibold">Full Name</label>
                <input 
                    type="text" 
                    class="form-control" 
                    name="fullName" 
                    value="{{ user.fullName }}"
                    required>
            </div>

            <!-- Email (read-only) -->
            <div class="col-12">
                <label class="form-label fw-semibold">Email</label>
                <input 
                    type="email" 
                    class="form-control bg-light" 
                    value="{{ user.email }}" 
                    readonly>
            </div>

            <!-- Mobile -->
            <div class="col-12">
                <label class="form-label fw-semibold">Mobile Number</label>
                <input 
                    type="text" 
                    class="form-control" 
                    name="mobile" 
                    value="{{ user.mobile }}">
            </div>

            <!-- Save Button -->
            <div class="col-12">
                <button class="btn btn-primary w-100">Update Profile</button>
            </div>

        </form>

        <!-- Logout Button -->
        <a href="{{ url_for('logout') }}" class="btn btn-outline-danger w-100 mt-3">Logout</a>

    </div>

</div>

<style>
/* Mobile responsiveness tweaks */
@media (max-width: 768px) {
    .card {
        padding: 20px !important;
    }
}
</style>

{% endblock %}
