<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <title>DataSci | {{ title if title else "Authentication" }}</title>

    <!-- Fonts & Icons -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">

    <!-- Bootstrap 5 -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">

    <style>
        :root {
            --bg-main: #050b14;
            --bg-surface: rgba(13, 22, 41, 0.75);
            --accent-cyan: #06b6d4;
            --accent-blue: #3b82f6;
            --border-subtle: rgba(56, 189, 248, 0.15);
            --text-main: #f8fafc;
            --text-sub: #94a3b8;
        }

        body {
            background-color: var(--bg-main);
            background-image: radial-gradient(circle at 50% 15%, rgba(6, 182, 212, 0.14) 0%, rgba(5, 11, 20, 0.98) 75%);
            color: var(--text-main);
            font-family: 'Plus Jakarta Sans', sans-serif;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px 15px;
            margin: 0;
        }

        .text-gradient {
            background: linear-gradient(135deg, #67e8f9 0%, #3b82f6 50%, #9333ea 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .auth-card {
            width: 100%;
            max-width: 440px;
            background: var(--bg-surface);
            backdrop-filter: blur(18px);
            -webkit-backdrop-filter: blur(18px);
            border: 1px solid var(--border-subtle);
            border-radius: 20px;
            padding: 36px;
            box-shadow: 0 20px 45px rgba(0, 0, 0, 0.5);
            position: relative;
        }

        .auth-brand {
            display: inline-flex;
            align-items: center;
            gap: 10px;
            text-decoration: none;
            color: #ffffff;
            margin-bottom: 20px;
        }

        .auth-brand img {
            height: 38px;
            width: auto;
            filter: drop-shadow(0 0 10px rgba(6, 182, 212, 0.45));
        }

        .auth-title {
            font-weight: 700;
            color: #ffffff;
            text-align: center;
            margin-bottom: 22px;
        }

        /* Form Inputs Styling */
        .form-control, .form-select {
            background: rgba(13, 22, 41, 0.85) !important;
            border: 1px solid var(--border-subtle) !important;
            color: #ffffff !important;
            border-radius: 10px;
            padding: 12px 16px;
            font-size: 0.95rem;
        }

        .form-control:focus, .form-select:focus {
            border-color: var(--accent-cyan) !important;
            box-shadow: 0 0 15px rgba(6, 182, 212, 0.3) !important;
        }

        .form-control::placeholder {
            color: #64748b;
        }

        .form-label {
            font-size: 0.85rem;
            color: var(--text-sub);
            font-weight: 500;
            margin-bottom: 6px;
        }

        /* Glow Primary Button */
        .btn-glow-primary {
            background: linear-gradient(135deg, #06b6d4, #2563eb);
            color: #ffffff;
            border: none;
            border-radius: 10px;
            padding: 12px 24px;
            font-weight: 600;
            width: 100%;
            box-shadow: 0 0 25px rgba(6, 182, 212, 0.35);
            transition: all 0.25s ease;
        }

        .btn-glow-primary:hover {
            background: linear-gradient(135deg, #0891b2, #1d4ed8);
            color: #ffffff;
            transform: translateY(-2px);
            box-shadow: 0 0 35px rgba(6, 182, 212, 0.5);
        }

        .link-accent {
            color: var(--accent-cyan);
            text-decoration: none;
            font-weight: 600;
            transition: color 0.2s;
        }

        .link-accent:hover {
            color: #67e8f9;
            text-decoration: underline;
        }

        .footer-text {
            font-size: 13px;
            text-align: center;
            margin-top: 24px;
            color: var(--text-sub);
            border-top: 1px solid rgba(255, 255, 255, 0.08);
            padding-top: 18px;
        }

        @media (max-width: 576px) {
            .auth-card {
                padding: 26px 20px;
                border-radius: 16px;
            }
        }
    </style>
</head>

<body>

    <div class="auth-card">
        <!-- Logo / Brand Header -->
        <div class="text-center mb-2">
            <a href="/" class="auth-brand">
                <img src="{{ url_for('static', filename='images/datasci_logo.png') }}" alt="DataSci Logo">
                <span class="fs-4 fw-bold">Data<span class="text-gradient">Sci</span></span>
            </a>
        </div>

        <!-- Dynamic Auth Content -->
        {% block content %}{% endblock %}

        <!-- Card Footer -->
        <div class="footer-text">
            © 2025 <strong class="text-white">Aluvala Ediga Harsha Vardhan Goud</strong><br>
            <span style="font-size: 12px; color: #64748b;">MCA | AI & ML Developer</span>
        </div>
    </div>

    <!-- Bootstrap Bundle JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>

</body>
</html>
