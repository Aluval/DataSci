<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">

  <title>DataSci | {{ title if title else "Authentication" }}</title>

  <!-- Bootstrap -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">

  <style>
      body {
          background: #f0f4ff;
          min-height: 100vh;
          display: flex;
          justify-content: center;
          align-items: center;
          padding: 15px;
      }

      .auth-card {
          width: 100%;
          max-width: 420px;
          background: #ffffff;
          border-radius: 16px;
          padding: 32px;
          box-shadow: 0 4px 15px rgba(0, 0, 0, 0.12);
      }

      .auth-title {
          font-weight: 700;
          color: #0d6efd;
          text-align: center;
          margin-bottom: 22px;
      }

      .footer-text {
          font-size: 12px;
          text-align: center;
          margin-top: 18px;
          color: #666;
      }

      @media (max-width: 576px) {
          .auth-card {
              padding: 24px;
              border-radius: 14px;
          }
      }
  </style>
</head>

<body>

    <div class="auth-card">
        {% block content %}{% endblock %}

        <div class="footer-text">
            © 2025 <strong>Aluvala Ediga Harsha Vardhan Goud</strong><br>
            MCA | AI & ML Developer
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>

</body>
</html>
