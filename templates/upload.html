{% extends 'base.html' %}
{% block content %}
<div class="row justify-content-center">
  <div class="col-md-8">
    <div class="card p-4">
      <h3>Upload Your CSV File</h3>
      <form method="post" enctype="multipart/form-data">
        <div class="mb-3"><label>Select CSV</label><input class="form-control" type="file" name="file" accept=".csv" required></div>
        <button class="btn btn-primary">Upload & Continue</button>
      </form>
    </div>
  </div>
</div>
{% endblock %}
