{% extends 'auth_base.html' %}
{% block content %}

<nav class="navbar navbar-dark" style="background:#0d6efd;">
  <div class="container-fluid">
    <a class="navbar-brand fw-bold text-white">DataSci</a>
  </div>
</nav>

<div class="row justify-content-center mt-4">
  <div class="col-md-5">

    <div class="card p-4 shadow">
      <h3 class="mb-3 text-center">Login</h3>

      <form method="post" onsubmit="return checkAgreement()">
        <div class="mb-3">
          <label>Email</label>
          <input class="form-control" name="email" type="email" required>
        </div>

        <div class="mb-3">
          <label>Password</label>
          <input class="form-control" name="password" type="password" required>
        </div>

        <div class="form-check mb-3">
          <input class="form-check-input" type="checkbox" id="agreeCheck">
          <label class="form-check-label">
            I agree to the <a href="#" onclick="showPolicy()">Privacy Policy</a> & 
            <a href="#" onclick="showTerms()">Terms</a>.
          </label>
        </div>

        <button class="btn btn-primary w-100">Login</button>
        <a class="btn btn-link w-100 text-center" href="{{ url_for('register') }}">Create account</a>
      </form>

    </div>
  </div>
</div>

<script>
function checkAgreement() {
  if (!document.getElementById("agreeCheck").checked) {
    alert("Please agree to the Privacy Policy & Terms to continue.");
    return false;
  }
  return true;
}

function showPolicy() {
  alert("Privacy Policy:\n\nWe collect only your Name, Email, and Phone Number.\nYour data is NOT shared.\nYour information is not fully secured (for demo project).\nUse responsibly.");
}

function showTerms() {
  alert("Terms & Conditions:\n\nDo not misuse the application.\nDo not upload harmful data.\nThis tool is for educational & ML project purposes only.");
}
</script>

{% endblock %}
