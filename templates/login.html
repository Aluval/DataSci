{% extends "auth_base.html" %}

{% block content %}
<h3 class="auth-title">Login</h3>

<!-- Flash messages FIX -->
{% with messages = get_flashed_messages(with_categories=true) %}
  {% if messages %}
    {% for category, msg in messages %}
      <div class="alert alert-{{ category }} alert-dismissible fade show mt-2">
        {{ msg }}
        <button class="btn-close" data-bs-dismiss="alert"></button>
      </div>
    {% endfor %}
  {% endif %}
{% endwith %}

<form method="POST" class="mt-3">

    <label class="fw-semibold">Email</label>
    <input class="form-control mb-3" type="email" name="email" required>

    <label class="fw-semibold">Password</label>
    <input class="form-control mb-3" type="password" name="password" required>

    <div class="form-check mb-3">
        <input class="form-check-input" type="checkbox" name="agree" id="agreeLogin">
        <label class="form-check-label" for="agreeLogin">
            I agree to the 
            <a href="#" data-bs-toggle="modal" data-bs-target="#termsModal">Terms</a> &
            <a href="#" data-bs-toggle="modal" data-bs-target="#privacyModal">Privacy Policy</a>
        </label>
    </div>

    <button class="btn btn-primary w-100">Login</button>

    <a href="{{ url_for('register') }}" class="btn btn-link w-100 mt-2">
        Create new account
    </a>
</form>

<!-- Modals stay same -->
{% endblock %}
